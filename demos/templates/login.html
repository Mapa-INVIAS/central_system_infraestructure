{% extends 'index.html' %}
{% block title %}: Ingreso{% endblock %}
<!-- Header content -->
{% block header %}{% endblock %}
{% block content %}

<section>
    <form id="uploadForm" action="" method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <!-- Text error -->
        {% if messages %}
            {% for message in messages %}
                <div class="content-alert alert alert-{{ message.tags }} alert-dismissable fade show" role="alert">
                    {{ message }}
                    <button type="button" class="close-btn" data-bs-dismiss="alert" aria-label="Close"><b>X</b></button>
                </div>
            {% endfor %}
        {% endif %}
        <h1>Ingrese las credenciales</h1>
        <input type="text" name="username" id="noteInput" placeholder="Ingresar usuario" required>
        <input type="password" name="password" id="noteInput" placeholder="Ingresar contraseña" required>
        <input type="submit" value="Ingresar">
    </form>
</section>

{% endblock %}
