<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Cargar múltiples GeoJSON con mapas base</title>
    <link rel="stylesheet" href="https://js.arcgis.com/4.29/esri/themes/light/main.css" />
    <script src="https://js.arcgis.com/4.29/"></script>
    <style>
      html, body, #viewDiv {
        padding: 0;
        margin: 0;
        height: 100%;
        width: 100%;
      }
      #fileInput {
        position: absolute;
        bottom: 5%;
        left: 10px;
        z-index: 99;
        background: white;
        padding: 8px;
        border: 1px solid #ccc;
      }
      #layersList {
        position: absolute;
        bottom: 9%;
        left: 10px;
        z-index: 99;
        background: white;
        padding: 8px;
        border: 1px solid #ccc;
        max-height: 200px;
        overflow-y: auto;
      }
    </style>
    <script>
      require([
        "esri/Map",
        "esri/views/MapView",
        "esri/layers/FeatureLayer",
        "esri/Graphic",
        "esri/widgets/BasemapGallery",
        "esri/widgets/Expand"
      ], function(Map, MapView, FeatureLayer, Graphic, BasemapGallery, Expand) {

        const map = new Map({ basemap: "streets" });

        const view = new MapView({
          container: "viewDiv",
          map: map,
          center: [-75.5636, 6.2519],
          zoom: 5
        });

        // Widget de galería de mapas base
        const basemapGallery = new BasemapGallery({
          view: view
        });

        // Expand para mostrar/ocultar la galería
        const expand = new Expand({
          view: view,
          content: basemapGallery,
          expanded: false
        });

        view.ui.add(expand, "top-right");

        const capas = [];

        function cargarArchivo(event) {
          const file = event.target.files[0];
          if (!file) return;

          const reader = new FileReader();
          reader.onload = function(e) {
            const geojson = JSON.parse(e.target.result);

            const graphics = geojson.features.map((f, i) => {
              let geometry;
              if (f.geometry.type === "Point") {
                geometry = {
                  type: "point",
                  longitude: f.geometry.coordinates[0],
                  latitude: f.geometry.coordinates[1]
                };
              } else if (f.geometry.type === "LineString") {
                geometry = {
                  type: "polyline",
                  paths: [f.geometry.coordinates]
                };
              } else if (f.geometry.type === "Polygon") {
                geometry = {
                  type: "polygon",
                  rings: f.geometry.coordinates
                };
              }
              return new Graphic({
                geometry: geometry,
                attributes: { ...f.properties, id: i }
              });
            });

            const fields = Object.keys(geojson.features[0].properties).map(k => ({
              name: k,
              type: "string"
            }));
            fields.push({ name: "id", type: "oid" });

            const tipo = geojson.features[0].geometry.type;
            let renderer;
            if (tipo === "Point") {
              renderer = {
                type: "simple",
                symbol: {
                  type: "simple-marker",
                  color: "red",
                  size: 8,
                  outline: { color: "white", width: 1 }
                }
              };
            } else if (tipo === "LineString") {
              renderer = {
                type: "simple",
                symbol: {
                  type: "simple-line",
                  color: "blue",
                  width: 2
                }
              };
            } else if (tipo === "Polygon") {
              renderer = {
                type: "simple",
                symbol: {
                  type: "simple-fill",
                  color: "rgba(0,255,0,0.4)",
                  outline: { color: "green", width: 1 }
                }
              };
            }

            const layer = new FeatureLayer({
              source: graphics,
              objectIdField: "id",
              fields: fields,
              title: file.name,
              renderer: renderer
            });

            map.add(layer);
            capas.push(layer);

            const btn = document.createElement("button");
            btn.textContent = "Eliminar " + file.name;
            btn.onclick = function() {
              map.remove(layer);
              capas.splice(capas.indexOf(layer), 1);
              btn.remove();
            };
            document.getElementById("layersList").appendChild(btn);
          };
          reader.readAsText(file);
        }

        document.getElementById("fileInput").addEventListener("change", cargarArchivo);
      });
    </script>
  </head>
  <body>
    <div id="viewDiv"></div>
    <input type="file" id="fileInput" accept=".geojson,.json" />
    <div id="layersList"></div>
  </body>
</html>
