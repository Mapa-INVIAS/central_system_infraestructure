<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Tipografía -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- Iconografía -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@flaticon/flaticon-uicons@3.3.1/css/all/all.min.css">
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    {% load static %}
    <link rel="icon" href="{% static 'frontend/img/invias_sin_text.ico' %}">
    <link rel="stylesheet" href="{% static 'frontend/styles/main.css' %}">
    <title>Inicio {% block title %}{% endblock %}</title>
</head>
<body>
    {% include "partials/header.html" %}
    {% block content %}{% endblock %}
    {% include "partials/footer.html" %}

    <!-- ================= SCRIPTS ================= -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'frontend/scripts/scripts/nav--hide-on-scroll.js' %}"></script>

    <script src="{% static 'frontend/scripts/scripts/roadmap.js' %}"></script>
    <script src="{% static 'frontend/scripts/scripts/fauna-stats.js' %}"></script>
    <script src="{% static 'frontend/scripts/scripts/aliados-carousel.js' %}"></script>
    <script src="{% static 'frontend/scripts/scripts/project-slider.js' %}"></script>
    <script src="{% static 'frontend/scripts/scripts/fauna-slider.js' %}"></script>
    <script src="{% static 'frontend/scripts/scripts/menu.js' %}"></script>
</body>
</html>
